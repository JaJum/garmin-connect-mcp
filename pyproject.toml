[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "garmin-connect-mcp"
version = "0.1.0"
description = "A modular, testable Garmin Connect MCP server with health reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv==1.2.2",
    "garminconnect==0.3.2",
    "mcp>=1.28.1,<2",
]

[project.scripts]
garmin-connect-mcp = "garmin_connect_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.2",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_connect_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:tmpdir -p no:cacheprovider"


